name: Build EH-MC16 recovery test firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eh-mc16-homekit-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make git file

      - name: Fetch pinned Bee2 SDK
        run: |
          git clone https://github.com/wuwbobo/rtl8762c-sdk-gcc.git bee2-sdk
          cd bee2-sdk
          git checkout 88aa8c7b72370f86a0841a07610901ef4091094e

      - name: Fetch pinned HomeKit ADK
        run: |
          git clone https://github.com/apple/HomeKitADK.git homekit-adk
          cd homekit-adk
          git checkout fb201f98f5fdc7fef6a455054f08b59cca5d1ec8

      - name: Fetch pinned Mbed TLS
        run: |
          git clone https://github.com/Mbed-TLS/mbedtls.git mbedtls
          cd mbedtls
          git checkout ca933c7e0c9e84738b168b6b0feb89af4183a60a
          git submodule update --init --recursive

      - name: Verify HomeKit BLE port surface
        run: |
          python3 scripts/check_hap_adk.py homekit-adk

      - name: Syntax-check Bee2 HAP BLE adapter
        run: |
          arm-none-eabi-gcc -std=gnu11 -fsyntax-only \
            -D__has_feature\(x\)=0 \
            -Ihomekit/bee2 \
            -Ihomekit-adk/PAL \
            -Ihomekit-adk/HAP \
            -Ibee2-sdk/inc \
            -Ibee2-sdk/inc/bluetooth \
            -Ibee2-sdk/inc/bluetooth/gap \
            -Ibee2-sdk/inc/bluetooth/profile \
            -Ibee2-sdk/inc/bluetooth/profile/server \
            homekit/bee2/HAPPlatformBLEPeripheralManager.c

      - name: Syntax-check HomeKit Outlet app
        run: |
          arm-none-eabi-gcc -std=gnu11 -fsyntax-only \
            -D__has_feature\(x\)=0 \
            -Ihomekit/app \
            -Ihomekit-adk/HAP \
            -Ihomekit-adk/PAL \
            homekit/app/DB.c homekit/app/App.c

      - name: Syntax-check Bee2 HAP clock timer random PAL
        run: |
          arm-none-eabi-gcc -std=gnu11 -fsyntax-only \
            -D__has_feature\(x\)=0 \
            -Ihomekit-adk/HAP \
            -Ihomekit-adk/PAL \
            -Ibee2-sdk/inc \
            -Ibee2-sdk/inc/os \
            -Ibee2-sdk/inc/platform \
            homekit/bee2/HAPPlatformClock.c \
            homekit/bee2/HAPPlatformTimer.c \
            homekit/bee2/HAPPlatformRandomNumber.c

      - name: Syntax-check Bee2 HAP KVS
        run: |
          arm-none-eabi-gcc -std=gnu11 -fsyntax-only \
            -D__has_feature\(x\)=0 \
            -Ihomekit/bee2 \
            -Ihomekit-adk/HAP \
            -Ihomekit-adk/PAL \
            -Ibee2-sdk/inc \
            -Ibee2-sdk/inc/platform \
            homekit/bee2/HAPPlatformKeyValueStore.c

      - name: Syntax-check Bee2 HAP run loop
        run: |
          arm-none-eabi-gcc -std=gnu11 -fsyntax-only \
            -D__has_feature\(x\)=0 \
            -Ihomekit/bee2 \
            -Ihomekit-adk/HAP \
            -Ihomekit-adk/PAL \
            -Ibee2-sdk/inc \
            -Ibee2-sdk/inc/app \
            -Ibee2-sdk/inc/os \
            homekit/bee2/HAPPlatformRunLoop.c

      - name: Syntax-check HomeKit bootstrap
        run: |
          arm-none-eabi-gcc -std=gnu11 -fsyntax-only \
            -D__has_feature\(x\)=0 -DBLE=1 \
            -Ihomekit/app \
            -Ihomekit/bee2 \
            -Ihomekit-adk/HAP \
            -Ihomekit-adk/PAL \
            -Ibee2-sdk/inc \
            -Ibee2-sdk/inc/app \
            -Ibee2-sdk/inc/os \
            -Ibee2-sdk/inc/platform \
            -Ibee2-sdk/inc/bluetooth \
            -Ibee2-sdk/inc/bluetooth/gap \
            -Ibee2-sdk/inc/bluetooth/profile \
            -Ibee2-sdk/inc/bluetooth/profile/server \
            homekit/bee2/HomeKitBootstrap.c

      - name: Syntax-check HomeKit Mbed TLS crypto PAL
        run: |
          arm-none-eabi-gcc -std=gnu11 -fsyntax-only \
            -D__has_feature\(x\)=0 -DBLE=1 \
            -Ihomekit-adk/HAP \
            -Ihomekit-adk/PAL \
            -Ihomekit-adk/PAL/Crypto/MbedTLS \
            -Ihomekit-adk/External/HTTP \
            -Ihomekit-adk/External/JSON \
            -Ihomekit-adk/External/Base64 \
            -Imbedtls/include \
            homekit-adk/PAL/Crypto/MbedTLS/HAPMbedTLS.c

      - name: Syntax-check Bee2 HAP log abort PAL
        run: |
          arm-none-eabi-gcc -std=gnu11 -fsyntax-only \
            -D__has_feature\(x\)=0 \
            -Ihomekit-adk/HAP \
            -Ihomekit-adk/PAL \
            -Ibee2-sdk/inc \
            -Ibee2-sdk/inc/peripheral \
            -Ibee2-sdk/inc/platform \
            -Ibee2-sdk/inc/platform/cmsis \
            homekit/bee2/HAPPlatformLog.c \
            homekit/bee2/HAPPlatformAbort.c

      - name: Build HomeKit ARM archives
        run: |
          chmod +x scripts/build_homekit_arm.sh
          scripts/build_homekit_arm.sh homekit-adk mbedtls bee2-sdk build/homekit-arm

      - name: Prepare Linux build tools
        run: |
          chmod +x bee2-sdk/tool/memory_icf/MemDefine || true
          chmod +x bee2-sdk/tool/hex2bin/Hex2Bin || true
          chmod +x bee2-sdk/tool/prepend_header/prepend_header || true
          chmod +x bee2-sdk/tool/md5/md5 || true

          PROJECT=bee2-sdk/board/evb/silent_ota_gcc/Makefile

          # The mirror is flattened compared with the original SDK ZIP.
          # Fix Windows-only tool name and the stale startup source path.
          sed -i 's#../../../tool/memory_icf/MemDefine\.exe#../../../tool/memory_icf/MemDefine#g' "$PROJECT"
          sed -i 's#../../../../sdk/src/mcu/rtl876x/arm/startup_rtl8762c_gcc\.s#../../../src/mcu/rtl876x/arm/startup_rtl8762c_gcc.s#g' "$PROJECT"

      - name: Apply EH-MC16 test identity
        run: |
          python3 scripts/patch_sdk.py bee2-sdk

      - name: Build
        working-directory: bee2-sdk/board/evb/silent_ota_gcc
        run: |
          make clean || true
          set +e
          make V=1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ -f build/silent_ota.map ]; then
              python3 ../../../../scripts/map_sizes.py build/silent_ota.map || true
            fi
            echo "== largest HomeKit symbols =="
            arm-none-eabi-nm -S --size-sort ../../../bin/homekit.a | tail -80 || true
            echo "== largest Mbed TLS crypto symbols =="
            arm-none-eabi-nm -S --size-sort ../../../bin/libmbedcrypto.a | tail -80 || true
            exit "$rc"
          fi

      - name: Verify HomeKit symbols are linked
        run: |
          ELF=bee2-sdk/board/evb/silent_ota_gcc/build/silent_ota.elf
          arm-none-eabi-nm "$ELF" | grep -E 'EHHomeKitStart[[:space:]]*$'
          arm-none-eabi-nm "$ELF" | grep -E 'HAPAccessoryServerStart[[:space:]]*$'
          arm-none-eabi-nm "$ELF" | grep -E 'HAPPlatformBLEPeripheralManagerStartAdvertising[[:space:]]*$'

      - name: Inspect generated image
        run: |
          python3 scripts/inspect_image.py \
            bee2-sdk/board/evb/silent_ota_gcc/bin/silent_ota_MP.bin \
            build/image-info.txt
          cat build/image-info.txt

      - name: Collect artifacts
        run: |
          mkdir -p build/artifacts
          cp bee2-sdk/board/evb/silent_ota_gcc/bin/silent_ota_MP.bin build/artifacts/EH-MC16-HOMEKIT-BLE_MP.bin
          cp bee2-sdk/board/evb/silent_ota_gcc/bin/silent_ota.bin build/artifacts/EH-MC16-HOMEKIT-BLE.bin
          cp bee2-sdk/board/evb/silent_ota_gcc/build/silent_ota.elf build/artifacts/EH-MC16-HOMEKIT-BLE.elf
          cp build/image-info.txt build/artifacts/image-info.txt
          sha256sum build/artifacts/* > build/artifacts/SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: eh-mc16-homekit-ble-firmware
          path: build/artifacts/
          if-no-files-found: error


  layout-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make git file

      - name: Fetch pinned Bee2 SDK
        run: |
          git clone https://github.com/wuwbobo/rtl8762c-sdk-gcc.git bee2-sdk-bridge
          cd bee2-sdk-bridge
          git checkout 88aa8c7b72370f86a0841a07610901ef4091094e

      - name: Prepare Linux build tools
        run: |
          chmod +x bee2-sdk-bridge/tool/memory_icf/MemDefine || true
          chmod +x bee2-sdk-bridge/tool/hex2bin/Hex2Bin || true
          chmod +x bee2-sdk-bridge/tool/prepend_header/prepend_header || true
          chmod +x bee2-sdk-bridge/tool/md5/md5 || true
          PROJECT=bee2-sdk-bridge/board/evb/silent_ota_gcc/Makefile
          sed -i 's#../../../tool/memory_icf/MemDefine\.exe#../../../tool/memory_icf/MemDefine#g' "$PROJECT"
          sed -i 's#../../../../sdk/src/mcu/rtl876x/arm/startup_rtl8762c_gcc\.s#../../../src/mcu/rtl876x/arm/startup_rtl8762c_gcc.s#g' "$PROJECT"

      - name: Apply 512K OTA layout bridge
        run: |
          python3 scripts/patch_layout_bridge.py bee2-sdk-bridge

      - name: Build layout bridge
        working-directory: bee2-sdk-bridge/board/evb/silent_ota_gcc
        run: |
          make clean || true
          make V=1

      - name: Verify bridge is small enough for legacy 92K OTA slot
        run: |
          python3 scripts/inspect_image.py \
            bee2-sdk-bridge/board/evb/silent_ota_gcc/bin/silent_ota_MP.bin \
            build/layout-bridge-image-info.txt
          cat build/layout-bridge-image-info.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("build/layout-bridge-image-info.txt").read_text()
          m = re.search(r"payload_len=(\d+)", p)
          if not m:
              raise SystemExit("payload_len missing")
          n = int(m.group(1))
          if n > 92 * 1024:
              raise SystemExit(f"layout bridge too large for old OTA slot: {n} bytes")
          print(f"bridge payload fits legacy OTA slot: {n} bytes")
          PY

      - name: Collect bridge artifact
        run: |
          mkdir -p build/bridge-artifacts
          cp bee2-sdk-bridge/board/evb/silent_ota_gcc/bin/silent_ota_MP.bin build/bridge-artifacts/EH-MC16-LAYOUT-BRIDGE_MP.bin
          cp build/layout-bridge-image-info.txt build/bridge-artifacts/image-info.txt
          sha256sum build/bridge-artifacts/* > build/bridge-artifacts/SHA256SUMS.txt

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: eh-mc16-layout-bridge-firmware
          path: build/bridge-artifacts/
          if-no-files-found: error


  ha-ble:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make git file

      - name: Fetch pinned Bee2 SDK
        run: |
          git clone https://github.com/wuwbobo/rtl8762c-sdk-gcc.git bee2-sdk-ha
          cd bee2-sdk-ha
          git checkout 88aa8c7b72370f86a0841a07610901ef4091094e

      - name: Prepare Linux build tools
        run: |
          chmod +x bee2-sdk-ha/tool/memory_icf/MemDefine || true
          chmod +x bee2-sdk-ha/tool/hex2bin/Hex2Bin || true
          chmod +x bee2-sdk-ha/tool/prepend_header/prepend_header || true
          chmod +x bee2-sdk-ha/tool/md5/md5 || true
          PROJECT=bee2-sdk-ha/board/evb/silent_ota_gcc/Makefile
          sed -i 's#../../../tool/memory_icf/MemDefine\.exe#../../../tool/memory_icf/MemDefine#g' "$PROJECT"
          sed -i 's#../../../../sdk/src/mcu/rtl876x/arm/startup_rtl8762c_gcc\.s#../../../src/mcu/rtl876x/arm/startup_rtl8762c_gcc.s#g' "$PROJECT"

      - name: Apply HA BLE plug patch
        run: |
          python3 scripts/patch_ha_ble.py bee2-sdk-ha

      - name: Build HA BLE plug
        working-directory: bee2-sdk-ha/board/evb/silent_ota_gcc
        run: |
          make clean || true
          make V=1

      - name: Inspect HA BLE image
        run: |
          python3 scripts/inspect_image.py             bee2-sdk-ha/board/evb/silent_ota_gcc/bin/silent_ota_MP.bin             build/ha-ble-image-info.txt
          cat build/ha-ble-image-info.txt

      - name: Collect HA BLE artifact
        run: |
          mkdir -p build/ha-ble-artifacts
          cp bee2-sdk-ha/board/evb/silent_ota_gcc/bin/silent_ota_MP.bin build/ha-ble-artifacts/EH-MC16-HA-BLE_MP.bin
          cp bee2-sdk-ha/board/evb/silent_ota_gcc/bin/silent_ota.bin build/ha-ble-artifacts/EH-MC16-HA-BLE.bin
          cp build/ha-ble-image-info.txt build/ha-ble-artifacts/image-info.txt
          sha256sum build/ha-ble-artifacts/* > build/ha-ble-artifacts/SHA256SUMS.txt

      - name: Upload HA BLE artifact
        uses: actions/upload-artifact@v4
        with:
          name: eh-mc16-ha-ble-firmware
          path: build/ha-ble-artifacts/
          if-no-files-found: error
